# Configuration ESSOR QMS. Toutes les valeurs sensibles viennent de variables d'environnement
# (voir deploy/.env.example) ; aucun secret par défaut.
server:
  port: 8080
  forward-headers-strategy: framework   # derrière Nginx (X-Forwarded-*)
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        secure: ${ESSOR_COOKIE_SECURE:false}
      timeout: 8h

spring:
  application:
    name: essor-qms
  datasource:
    # Rôle applicatif NON propriétaire : soumis à la RLS.
    url: ${ESSOR_DB_URL:jdbc:postgresql://localhost:5432/essor}
    username: ${ESSOR_DB_APP_USER:essor_app}
    password: ${ESSOR_DB_APP_PASSWORD:}
  flyway:
    # Les migrations s'exécutent avec le rôle propriétaire.
    user: ${ESSOR_DB_OWNER_USER:essor_owner}
    password: ${ESSOR_DB_OWNER_PASSWORD:}
  # E-mail des notifications : désactivé tant que ESSOR_SMTP_HOST est vide.
  mail:
    host: ${ESSOR_SMTP_HOST:}
    port: ${ESSOR_SMTP_PORT:25}
    username: ${ESSOR_SMTP_USERNAME:}
    password: ${ESSOR_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${ESSOR_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${ESSOR_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  mvc:
    async:
      request-timeout: 1800000   # flux SSE des notifications (30 min)
  servlet:
    multipart:
      max-file-size: 20MB     # versions de documents 20 Mo, pièces jointes 10 Mo et logo 512 Ko limités par leur service
      max-request-size: 21MB
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${ESSOR_OIDC_CLIENT_ID:essor-bff}
            client-secret: ${ESSOR_OIDC_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            # URL vue par le navigateur (via Nginx) et URLs internes (réseau Docker).
            authorization-uri: ${ESSOR_OIDC_PUBLIC_URL:http://localhost/auth/realms/essor}/protocol/openid-connect/auth
            token-uri: ${ESSOR_OIDC_INTERNAL_URL:http://localhost:8180/auth/realms/essor}/protocol/openid-connect/token
            jwk-set-uri: ${ESSOR_OIDC_INTERNAL_URL:http://localhost:8180/auth/realms/essor}/protocol/openid-connect/certs
            user-info-uri: ${ESSOR_OIDC_INTERNAL_URL:http://localhost:8180/auth/realms/essor}/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          jwk-set-uri: ${ESSOR_OIDC_INTERNAL_URL:http://localhost:8180/auth/realms/essor}/protocol/openid-connect/certs
          issuer-uri: ${ESSOR_OIDC_PUBLIC_URL:http://localhost/auth/realms/essor}

essor:
  storage:
    dir: ${ESSOR_STORAGE_DIR:./data/files}
  tenancy:
    default-tenant-code: ${ESSOR_DEFAULT_TENANT_CODE:DEMO}
    tenant-claim: tenant
  smtp:
    from: ${ESSOR_SMTP_FROM:essor-qms@localhost}
  notifications:
    deadline-cron: ${ESSOR_DEADLINE_CRON:0 0 6 * * *}   # retards et échéances J-2, chaque jour à 6 h
  security:
    end-session-uri: ${ESSOR_OIDC_PUBLIC_URL:http://localhost/auth/realms/essor}/protocol/openid-connect/logout
    post-logout-redirect-uri: ${ESSOR_PUBLIC_URL:http://localhost}/

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false   # un SMTP indisponible ne rend pas l'application « DOWN »
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
