name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Tests d'intégration via Testcontainers (Docker disponible sur les runners ubuntu).
      - name: Build et tests
        run: mvn -B verify
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-backend
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 7

  dependency-check:
    # Analyse OWASP des dépendances ; non bloquante (base NVD parfois injoignable).
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP dependency-check
        run: mvn -B org.owasp:dependency-check-maven:check || echo "::warning::dependency-check non exécuté (base NVD injoignable ?)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-backend
          path: backend/target/dependency-check-report.*
          retention-days: 7
