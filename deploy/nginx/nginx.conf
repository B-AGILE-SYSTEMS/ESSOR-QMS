worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    client_max_body_size 21m;  # versions de documents : 20 Mo max côté API (pièces jointes 10 Mo, logo 512 Ko)

    # Résolution dynamique (DNS Docker) : Nginx démarre même si un service (ex. web) est absent.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Aucune donnée personnelle dans les journaux : pas de query string, pas d'en-têtes.
    log_format essor '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log essor;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;

        set $backend  http://backend:8080;
        set $keycloak http://keycloak:8080;
        set $web      http://web:80;

        location /api/    { proxy_pass $backend; }
        # Notifications temps réel (SSE) : pas de mise en tampon, connexion longue.
        location = /api/notifications/stream {
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }
        location /oauth2/ { proxy_pass $backend; }
        location /login/  { proxy_pass $backend; }
        location = /logout { proxy_pass $backend; }

        location /auth/ {
            proxy_pass $keycloak;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }

        location / {
            proxy_pass $web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
